<html
<div class="modal fade" id="updateformteacher" style="display: none;" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
        <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Update Student Records Here</h5>
        
      </div>
      
      <div class="modal-body">
        <form method="POST" action="{% url 'update_teacher'%}">
            {%csrf_token%}
          <div class="form-group">
            <label for="recipient-name" class="col-form-label">Teacher Id:</label>
            <input type="text"   value="{{tu.tid}}"  class="form-control" id="recipient-name" name="tid">
             
          </div>
          
          <div class="form-group">
            <label for="recipient-name" class="col-form-label">First Name</label>
            <input type="text"  value="{{tu.t_1st_name}}" class="form-control" id="recipient-name" name="t_1st_name">
          </div>
          <div class="form-group">
            <label for="recipient-name" class="col-form-label">Last Name</label>
            <input type="text" value="{{tu.t_last_name}}" class="form-control" id="recipient-name" name="t_last_name">
          </div>
          <div class="form-group">
            <label for="recipient-name" class="col-form-label">Age</label>
            <input type="text" value="{{tu.age}}" class="form-control" id="recipient-name" name="age">
          </div>
          <div class="form-group">
            <label for="recipient-name" class="col-form-label">Qualification</label>
            <input type="text"  value="{{tu.qualilfiaction}}" class="form-control" id="recipient-name" name="qualification">
          </div>
          <div class="form-group">
            <label for="recipient-name" class="col-form-label">Address</label>
            <input type="text" value="{{tu.address}}" class="form-control" id="recipient-name" name="address">
          </div>
          <div class="form-group">
            <label for="recipient-name" class="col-form-label">Phone Number</label>
            <input type="text" value="{{tu.contactno}}" class="form-control" id="recipient-name" name="contactno">
          </div>
          <div class="form-group">
            <label for="recipient-name" class="col-form-label">Gender</label>
            <input type="text" value="{{tu.gender}}" class="form-control" id="recipient-name" name="gender">
          </div>
          <div class="form-group">
            <label for="recipient-name" class="col-form-label">Email Address</label>
            <input type="text"  value="{{tu.email_of_teacher}}" class="form-control" id="recipient-name" name="email_of_teacher">
          </div>
          <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-dismiss="modal" onclick="closeForm('updateformteacher')">Close</button>
        <button type="submit" class="btn btn-primary">Update</button>
      </div>
         
        </form>
      </div>
      
    </div>
  </div>
</div><br>
