{% load static %}

<html><head><link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
        <style>

        body{
            font-family: Arial;
            padding: 30px;
            background-color:cadetblue;
        }

        button{
            padding:10px 20px;
            margin:10px;
            border:none;
            background:blue;
            color:white;
            border-radius:5px;
            cursor:pointer;
        }

        /* Popup Background */
        .popup{
            display:none;
            position:fixed;
            top:0;
            left:0;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.5);
        }

        /* Popup Box */
        .popup-content{
            width:300px;
            background:white;
            padding:20px;
            border-radius:10px;
            margin:100px auto;
            position:relative;
        }

        /* Close Button */
        .close{
            position:absolute;
            right:15px;
            top:10px;
            font-size:22px;
            cursor:pointer;
            color:red;
        }

        input{
            width:100%;
            padding:8px;
            margin-top:10px;
        }

        .submit-btn{
            width:100%;
            padding:10px;
            margin-top:15px;
            background:red;
            color:white;
            border:none;
        }
        .error{
            color: red;
            font-size: 20px;
            display: block;
            font-weight:10px;
        }
        </style>
   
</head><p  style="color:black; position:relative" > VIEW STUDENT'S FEEDBACK</p>
      
       <button class="btn btn-danger me-2 " onclick="openPopup('popup2')">
                                     Delete
                                     </button>
                            
    {% if messages %}
       {% for message in messages %}
        <div class="message">
            {{ message }}
        </div>
       {% endfor %}
    {% endif %} </p>    

       
    <body>
      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <div class="card chart-card shadow mt-4" style="width:1210px ">
        <div class="card-body">

            <table class="table table-hover">

                <thead class="table-dark">
                    
                    <tr>
                        <th >NAME OF STUDENT</th>
                        <th >FEEDBACK</th>
                        <th>EMAIL ADDRESS</th>
                        <th>ACTION</th>
                         
                    </tr>
                    
                </thead>

                <tbody>
                  
                        {%for i in vsf%}
                    <tr>
                              <td>{{i.sname}}</td>
                           <td>{{i.stext}}</td>
                           <td>{{i.semail}}</td>
                           
                           
                            <td  style="display:flex">
                              <button class="btn btn-danger me-2 " onclick="openPopup('popup2')">
                                     Delete
                                     </button>
                              
                            </td>
    </tr>
    {%endfor%} </tbody>

            </table>

        </div>
    </div>

</div>
<!-- DELETE STUDENT FEEDBACK-->
    <div class="popup" id="popup2" style="display:none">

        <div class="popup-content">

            <span class="close" onclick="closePopup('popup2')">
                &times;
            </span>

            <h3>select email</h3>

            <form method="POST" id="sf_delete" action="{% url 'delete_student_feedback'%}">
                {%csrf_token%}

                <input type="text" name="semail" id="semail_id" placeholder="select Date">
                <span id="semail_id_error" class="error"></span>

                <button class="submit-btn">
                    Delete
                </button>

            </form>

        </div>

    </div>





   

<script>

        function openPopup(id){
            document.getElementById(id).style.display = "block";
        }

        function closePopup(id){
            document.getElementById(id).style.display = "none";
        }

    </script>
    
      <script src="{% static 'js/add_validation_student_feedback1.js'%}"></script>
      
        
    </body>
</html>
