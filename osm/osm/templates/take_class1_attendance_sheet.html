<html><head> <style>.box{
    color: red;
    font-size: 25px;
    font-weight: 100;
}

</style>   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity></head>
    
<body>{%if messages%}
     {%for i in messages%}
        <p class="box">{{i}}</p>
     {%endfor%}
     {%endif%}

        <form method="post" action="{% url 'take_all_class_student_attendance'%}">

    {% csrf_token %}
    
    <table class="table table-info table-striped" width="90px" border="1" cellpadding="10">

        <tr >
            <th>Roll No</th>
            <th>Student  First Name</th>
            <th>Student  Last Name</th>
            <th>Status</th>
            <th>Date</th>
            <th>Class Name</th>
            
        </tr>

        {% for student in students %}

        <tr >

            <td>{{student.rollno}}</td>

            <td>{{student.s1stname}}</td>
            <td>{{student.slstname}}</td>

            <td>

                <input type="radio"
                       name="status_{{student.rollno}}"
                       value="Present">

                Present

                <input type="radio"
                       name="status_{{student.rollno}}"
                       value="Absent">

                Absent

                

            </td>
            <td>{{student.date}}</td>
            <td><input type="text" value="{{student.cname}}" name="cname"></td>
            
            

        </tr>

        {% endfor %}

    </table>

    <br>

    <button style="columns: green;" type="submit">
        Save Attendance
    </button>

</form>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
